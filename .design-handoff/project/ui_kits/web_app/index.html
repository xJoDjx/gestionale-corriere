<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLS Padroncini — UI Kit</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }

  :root {
    --bg-primary: #f7f8fa; --bg-secondary: #ffffff; --bg-tertiary: #f0f1f4; --bg-hover: #f1f3f6;
    --card-bg: #ffffff; --card-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 1px 3px rgba(15,23,42,0.04); --card-shadow-hover: 0 4px 12px rgba(15,23,42,0.08);
    --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
    --primary: #2563eb; --primary-hover: #1d4ed8; --primary-muted: rgba(37,99,235,0.10);
    --accent-orange: #f97316;
    --success: #16a34a; --success-bg: rgba(22,163,74,0.12);
    --warning: #d97706; --warning-bg: rgba(217,119,6,0.14);
    --danger: #dc2626; --danger-bg: rgba(220,38,38,0.12);
    --info: #2563eb; --info-bg: rgba(37,99,235,0.12);
    --badge-green: #15803d; --badge-green-bg: #dcfce7;
    --badge-orange: #c2410c; --badge-orange-bg: #ffedd5;
    --badge-red: #b91c1c; --badge-red-bg: #fee2e2;
    --badge-yellow: #a16207; --badge-yellow-bg: #fef3c7;
    --badge-blue: #1d4ed8; --badge-blue-bg: #dbeafe;
    --badge-purple: #7c3aed; --badge-purple-bg: #ede9fe;
    --badge-gray: #475569; --badge-gray-bg: #e2e8f0;
    --border: #e5e7eb; --border-strong: #d1d5db;
    --table-row-alt: #fafbfc; --table-row-hover: #f1f5f9;
    --sidebar-bg: #121821; --sidebar-item: #98a4b3;
    --font-sans: 'DM Sans', sans-serif; --font-mono: 'JetBrains Mono', monospace;
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
    --space-sm: 8px; --space-md: 16px; --space-lg: 24px;
  }
  [data-theme="dark"] {
    --bg-primary: #0f1117; --bg-secondary: #1a1d27; --bg-tertiary: #242837; --bg-hover: #323750;
    --card-bg: #1a1d27; --card-shadow: 0 1px 2px rgba(0,0,0,0.3); --card-shadow-hover: 0 4px 12px rgba(0,0,0,0.4);
    --text-primary: #e8eaf0; --text-secondary: #9ca3b4; --text-muted: #6b7280;
    --primary: #6366f1; --primary-hover: #818cf8;
    --border: #2a2e3d; --border-strong: #3d4259;
    --table-row-alt: #1e2230; --table-row-hover: #242a3a;
    --sidebar-bg: #141722;
    --badge-green: #4ade80; --badge-green-bg: rgba(34,197,94,0.18);
    --badge-orange: #fb923c; --badge-orange-bg: rgba(249,115,22,0.18);
    --badge-red: #f87171; --badge-red-bg: rgba(239,68,68,0.18);
    --badge-yellow: #fbbf24; --badge-yellow-bg: rgba(245,158,11,0.18);
    --badge-blue: #60a5fa; --badge-blue-bg: rgba(59,130,246,0.18);
    --badge-purple: #c084fc; --badge-purple-bg: rgba(168,85,247,0.18);
    --badge-gray: #9ca3af; --badge-gray-bg: rgba(107,114,128,0.18);
  }
  *, *::before, *::after { transition: background-color 0.15s ease, border-color 0.15s ease, color 0.05s ease; }

  body { font-family: var(--font-sans); background: var(--bg-primary); color: var(--text-primary); }
  #root { display: flex; min-height: 100vh; }
  button { font-family: var(--font-sans); cursor: pointer; }
  input, select, textarea { font-family: var(--font-sans); }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
</style>
</head>
<body data-theme="light">
<div id="root"></div>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Padroncini.jsx"></script>
<script type="text/babel" src="Conteggi.jsx"></script>
<script type="text/babel" src="Flotta.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const SCREENS = [
  { id: 'dashboard', label: 'Dashboard', icon: '📊' },
  { id: 'padroncini', label: 'Padroncini', icon: '👤' },
  { id: 'conteggi', label: 'Conteggi', icon: '📋' },
  { id: 'flotta', label: 'Flotta Mezzi', icon: '🚛' },
  { id: 'palmari', label: 'Palmari', icon: '📱' },
  { id: 'codici', label: 'Cod. Autisti', icon: '🏷️' },
  { id: 'ricariche', label: 'Ricariche', icon: '⚡' },
  null,
  { id: 'acconti', label: 'Acconti', icon: '💰' },
  { id: 'impostazioni', label: 'Impostazioni', icon: '⚙️' },
  { id: 'utenti', label: 'Utenti', icon: '👥' },
];

const PLACEHOLDER_SCREENS = ['palmari','codici','ricariche','acconti','impostazioni','utenti'];

function PlaceholderScreen({ screen }) {
  return (
    <div style={{ padding: 32 }}>
      <h1 style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>
        {screen.icon} {screen.label}
      </h1>
      <p style={{ color: 'var(--text-muted)', fontSize: 14 }}>
        Sezione in sviluppo — verrà implementata nel prossimo step.
      </p>
    </div>
  );
}

function App() {
  const [activeScreen, setActiveScreen] = useState(() => localStorage.getItem('gc.ui.screen') || 'dashboard');
  const [dark, setDark] = useState(() => localStorage.getItem('gc.ui.dark') === '1');
  const [collapsed, setCollapsed] = useState(() => localStorage.getItem('gc.ui.collapsed') === '1');

  useEffect(() => {
    document.body.dataset.theme = dark ? 'dark' : 'light';
    localStorage.setItem('gc.ui.dark', dark ? '1' : '0');
  }, [dark]);

  useEffect(() => {
    localStorage.setItem('gc.ui.screen', activeScreen);
  }, [activeScreen]);

  const screen = SCREENS.find(s => s && s.id === activeScreen) || SCREENS[0];

  function renderScreen() {
    if (activeScreen === 'dashboard') return <DashboardScreen />;
    if (activeScreen === 'padroncini') return <PadronciniScreen />;
    if (activeScreen === 'conteggi') return <ConteggiScreen />;
    if (activeScreen === 'flotta') return <FlottaScreen />;
    if (PLACEHOLDER_SCREENS.includes(activeScreen)) return <PlaceholderScreen screen={screen} />;
    return <DashboardScreen />;
  }

  return (
    <div style={{ display: 'flex', minHeight: '100vh' }}>
      <GCsidebar
        active={activeScreen}
        onNavigate={setActiveScreen}
        dark={dark}
        onToggleDark={() => setDark(d => !d)}
        collapsed={collapsed}
        onToggleCollapsed={() => setCollapsed(c => !c)}
      />
      <main style={{
        marginLeft: collapsed ? 72 : 220,
        flex: 1,
        minHeight: '100vh',
        background: 'var(--bg-primary)',
        transition: 'margin-left 0.2s ease',
        overflow: 'auto',
      }}>
        {renderScreen()}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
