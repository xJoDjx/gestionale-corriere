<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; background:#f7f8fa; padding:20px; }
.label { font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#94a3b8; margin-bottom:10px; }
.row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; box-shadow:0 1px 2px rgba(15,23,42,0.04); }
.card-header { padding:13px 16px; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; }
.card-title { font-size:13px; font-weight:600; color:#0f172a; }
.card-body { padding:16px; }
.card-count { background:#fee2e2; color:#b91c1c; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; }
</style>
</head>
<body>
<div class="label">Card Anatomy</div>
<div class="row">
  <div class="card" style="width:280px">
    <div class="card-header">
      <span class="card-title">Problemi e avvisi</span>
      <span class="card-count">4</span>
    </div>
    <div class="card-body" style="font-size:12px;color:#475569;line-height:1.6">
      Card con header separato da border-bottom.<br>
      Border: 1px #e5e7eb · Radius: 12px<br>
      Shadow: 0 1px 2px rgba(15,23,42,0.04)
    </div>
  </div>
  <div class="card" style="width:240px;padding:18px 20px;">
    <div style="font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8;margin-bottom:4px">Card senza header</div>
    <div style="font-size:13px;color:#475569">Padding diretto: 18px 20px. Usata per sezioni compatte.</div>
  </div>
  <div class="card" style="width:200px;box-shadow:0 4px 12px rgba(15,23,42,0.08);">
    <div class="card-header"><span class="card-title">Hover state</span></div>
    <div class="card-body" style="font-size:12px;color:#94a3b8">Shadow aumentata su hover.<br>--card-shadow-hover</div>
  </div>
</div>
</body>
</html>
