<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; background:#f7f8fa; padding:20px; }
.label { font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#94a3b8; margin-bottom:10px; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.kpi { border:1px solid #e5e7eb; border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:6px; background:#fff; }
.kpi-label { font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#94a3b8; }
.kpi-val { font-size:26px; font-weight:700; letter-spacing:-0.01em; color:#0f172a; line-height:1.1; }
.kpi-sub { font-size:10px; color:#94a3b8; }
.kpi--blue { background:#eff6ff; }
.kpi--blue .kpi-val { color:#1d4ed8; }
.kpi--red { background:#fef2f2; }
.kpi--red .kpi-val { color:#b91c1c; }
.kpi--green { background:#f0fdf4; }
.kpi--green .kpi-val { color:#15803d; }
.kpi--orange { background:#fff7ed; }
.kpi--orange .kpi-val { color:#c2410c; }
.kpi--purple { background:#faf5ff; }
.kpi--purple .kpi-val { color:#7c3aed; }
.kpi--yellow { background:#fefce8; }
.kpi--yellow .kpi-val { color:#a16207; }
.icon { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.head { display:flex; justify-content:space-between; align-items:flex-start; }
</style>
</head>
<body>
<div class="label">KPI Cards — Tinted Variants</div>
<div class="grid">
  <div class="kpi">
    <div class="head"><span class="kpi-label">Mezzi Totali</span><div class="icon" style="background:#dbeafe;color:#1d4ed8">🚛</div></div>
    <div class="kpi-val">33</div>
    <div class="kpi-sub">26 assegnati · 6 disponibili</div>
  </div>
  <div class="kpi kpi--blue">
    <div class="head"><span class="kpi-label">Da Bonificare</span><div class="icon" style="background:#bfdbfe;color:#1d4ed8">💰</div></div>
    <div class="kpi-val">€ 18.420</div>
    <div class="kpi-sub">Marzo 2026</div>
  </div>
  <div class="kpi kpi--green">
    <div class="head"><span class="kpi-label">Padroncini Attivi</span><div class="icon" style="background:#bbf7d0;color:#15803d">👤</div></div>
    <div class="kpi-val">12</div>
    <div class="kpi-sub">su 14 totali</div>
  </div>
  <div class="kpi kpi--orange">
    <div class="head"><span class="kpi-label">Conteggi Mese</span><div class="icon" style="background:#fed7aa;color:#c2410c">📋</div></div>
    <div class="kpi-val">3/12</div>
    <div class="kpi-sub">chiusi / totali</div>
  </div>
  <div class="kpi kpi--yellow">
    <div class="head"><span class="kpi-label">Scadenze</span><div class="icon" style="background:#fde68a;color:#a16207">⏰</div></div>
    <div class="kpi-val">30</div>
    <div class="kpi-sub">entro 30 giorni</div>
  </div>
  <div class="kpi kpi--red">
    <div class="head"><span class="kpi-label">DURC Scaduti</span><div class="icon" style="background:#fecaca;color:#b91c1c">⚠️</div></div>
    <div class="kpi-val">3</div>
    <div class="kpi-sub">richiedono azione</div>
  </div>
</div>
</body>
</html>
