<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; background:#f7f8fa; padding:20px; }
.label { font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#94a3b8; margin-bottom:10px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.alert { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:8px; background:#fff; border:1px solid #e5e7eb; }
.alert-danger  { border-left:3px solid #dc2626; }
.alert-warning { border-left:3px solid #d97706; }
.alert-info    { border-left:3px solid #2563eb; }
.alert-icon { font-size:15px; margin-top:1px; }
.alert-title { font-size:12px; font-weight:600; color:#0f172a; }
.alert-desc { font-size:11px; color:#94a3b8; margin-top:2px; }
.alert-btn { margin-left:auto; background:#f0f1f4; border:1px solid #e5e7eb; color:#475569; font-size:10px; font-weight:600; padding:3px 8px; border-radius:5px; cursor:pointer; white-space:nowrap; flex-shrink:0; font-family:'DM Sans',sans-serif; }
</style>
</head>
<body>
<div class="label">Alert / Notice Cards</div>
<div class="grid">
  <div class="alert alert-danger">
    <span class="alert-icon">⚠️</span>
    <div style="flex:1">
      <div class="alert-title">3 DURC scaduti</div>
      <div class="alert-desc">EL SPEDIZIONI, DI NARDO, IB EXPRESS</div>
    </div>
    <button class="alert-btn">Vedi padroncini</button>
  </div>
  <div class="alert alert-warning">
    <span class="alert-icon">🔧</span>
    <div style="flex:1">
      <div class="alert-title">30 mezzi con scadenze entro 30gg</div>
      <div class="alert-desc">Assicurazione, revisione o bollo</div>
    </div>
    <button class="alert-btn">Vedi flotta</button>
  </div>
  <div class="alert alert-info">
    <span class="alert-icon">📋</span>
    <div style="flex:1">
      <div class="alert-title">9 conteggi ancora in bozza</div>
      <div class="alert-desc">Marzo 2026 — non ancora chiusi</div>
    </div>
    <button class="alert-btn">Vedi conteggi</button>
  </div>
  <div class="alert alert-warning">
    <span class="alert-icon">📱</span>
    <div style="flex:1">
      <div class="alert-title">2 palmari senza assegnazione</div>
      <div class="alert-desc">PAL-007, PAL-008 disponibili</div>
    </div>
    <button class="alert-btn">Vedi palmari</button>
  </div>
</div>
</body>
</html>
