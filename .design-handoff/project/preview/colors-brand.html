<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f7f8fa; padding: 20px; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .swatch { flex: 1; border-radius: 8px; overflow: hidden; }
  .swatch-color { height: 56px; }
  .swatch-info { background: #fff; border: 1px solid #e5e7eb; border-top: none; padding: 8px 10px; border-radius: 0 0 8px 8px; }
  .swatch-name { font-size: 11px; font-weight: 700; color: #0f172a; }
  .swatch-hex  { font-size: 10px; color: #94a3b8; font-family: monospace; margin-top: 1px; }
  .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="section-label">Brand Colors</div>
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#121821"></div>
    <div class="swatch-info"><div class="swatch-name">Sidebar Dark</div><div class="swatch-hex">#121821</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#2563eb"></div>
    <div class="swatch-info"><div class="swatch-name">Primary</div><div class="swatch-hex">#2563eb</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#1d4ed8"></div>
    <div class="swatch-info"><div class="swatch-name">Primary Hover</div><div class="swatch-hex">#1d4ed8</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#f97316"></div>
    <div class="swatch-info"><div class="swatch-name">Accent Orange</div><div class="swatch-hex">#f97316</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#6366f1"></div>
    <div class="swatch-info"><div class="swatch-name">Primary Dark</div><div class="swatch-hex">#6366f1</div></div>
  </div>
</div>
<div class="section-label">Backgrounds (Light)</div>
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#f7f8fa; border: 1px solid #e5e7eb;"></div>
    <div class="swatch-info"><div class="swatch-name">bg-primary</div><div class="swatch-hex">#f7f8fa</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#ffffff; border: 1px solid #e5e7eb;"></div>
    <div class="swatch-info"><div class="swatch-name">bg-secondary</div><div class="swatch-hex">#ffffff</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#f0f1f4; border: 1px solid #e5e7eb;"></div>
    <div class="swatch-info"><div class="swatch-name">bg-tertiary</div><div class="swatch-hex">#f0f1f4</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#f1f3f6; border: 1px solid #e5e7eb;"></div>
    <div class="swatch-info"><div class="swatch-name">bg-hover</div><div class="swatch-hex">#f1f3f6</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#e5e7eb;"></div>
    <div class="swatch-info"><div class="swatch-name">border</div><div class="swatch-hex">#e5e7eb</div></div>
  </div>
</div>
</body>
</html>
