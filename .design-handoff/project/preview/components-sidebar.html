<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; background:#f7f8fa; padding:20px; display:flex; gap:20px; }
.label { font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#6b7280; margin-bottom:8px; }
.sidebar { width:200px; min-height:320px; background:#121821; border-radius:12px; display:flex; flex-direction:column; padding:12px 0; flex-shrink:0; }
.brand { display:flex; align-items:center; gap:9px; padding:6px 14px 14px; }
.brand-icon { width:34px; height:34px; background:#f97316; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.brand-title { font-size:15px; font-weight:700; color:#e8eaf0; letter-spacing:0.02em; line-height:1; }
.brand-sub { font-size:9px; font-weight:700; color:#6b7280; letter-spacing:0.12em; text-transform:uppercase; }
.nav { padding:0 8px; flex:1; }
.item { display:flex; align-items:center; gap:10px; padding:8px 11px; border-radius:7px; color:#98a4b3; font-size:13px; font-weight:500; margin-bottom:2px; cursor:pointer; }
.item:hover { background:rgba(241,245,249,0.08); color:#e8eaf0; }
.item.active { background:#2563eb; color:#fff; }
.divider { height:1px; background:#1e2230; margin:8px 12px; }
.icon { font-size:14px; width:18px; text-align:center; }
.footer { padding:10px 12px 8px; border-top:1px solid #1e2230; }
.user-row { display:flex; align-items:center; gap:8px; padding:6px 8px; background:#0f1117; border-radius:7px; }
.avatar { width:26px; height:26px; border-radius:50%; background:#2563eb; color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; }
.user-name { font-size:11px; font-weight:600; color:#e8eaf0; }
.user-role { font-size:9px; color:#6b7280; }
</style>
</head>
<body>
<div>
<div class="label">Sidebar (expanded)</div>
<div class="sidebar">
  <div class="brand">
    <div class="brand-icon">🚚</div>
    <div><div class="brand-title">GLS</div><div class="brand-sub">PADRONCINI</div></div>
  </div>
  <div class="nav">
    <div class="item active"><span class="icon">📊</span> Dashboard</div>
    <div class="item"><span class="icon">👤</span> Padroncini</div>
    <div class="item"><span class="icon">📋</span> Conteggi</div>
    <div class="item"><span class="icon">🚛</span> Flotta Mezzi</div>
    <div class="item"><span class="icon">📱</span> Palmari</div>
    <div class="item"><span class="icon">🏷️</span> Cod. Autisti</div>
    <div class="item"><span class="icon">⚡</span> Ricariche</div>
    <div class="divider"></div>
    <div class="item"><span class="icon">💰</span> Acconti</div>
    <div class="item"><span class="icon">⚙️</span> Impostazioni</div>
  </div>
  <div class="footer">
    <div class="user-row">
      <div class="avatar">A</div>
      <div><div class="user-name">Amministratore</div><div class="user-role">Admin</div></div>
    </div>
  </div>
</div>
</div>
<div>
<div class="label">Collapsed (72px)</div>
<div class="sidebar" style="width:72px;align-items:center;">
  <div style="padding:6px 0 14px;"><div class="brand-icon">🚚</div></div>
  <div class="nav" style="width:100%;">
    <div class="item active" style="justify-content:center;padding:9px"><span class="icon">📊</span></div>
    <div class="item" style="justify-content:center;padding:9px"><span class="icon">👤</span></div>
    <div class="item" style="justify-content:center;padding:9px"><span class="icon">📋</span></div>
    <div class="item" style="justify-content:center;padding:9px"><span class="icon">🚛</span></div>
    <div class="item" style="justify-content:center;padding:9px"><span class="icon">📱</span></div>
    <div class="item" style="justify-content:center;padding:9px"><span class="icon">⚡</span></div>
  </div>
</div>
</div>
</body>
</html>
