<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f7f8fa; padding: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; }
  .swatch-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; }
  .swatch { border-radius: 6px; overflow: hidden; }
  .top { height: 32px; }
  .bot { background: #fff; border: 1px solid #e5e7eb; border-top: none; padding: 5px 6px; border-radius: 0 0 6px 6px; }
  .name { font-size: 9px; font-weight: 700; color: #0f172a; }
  .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="section-label">Badge Pills</div>
<div class="row">
  <span class="badge" style="color:#15803d;background:#dcfce7">ATTIVO</span>
  <span class="badge" style="color:#1d4ed8;background:#dbeafe">CONFERMATO</span>
  <span class="badge" style="color:#c2410c;background:#ffedd5">IN SCADENZA</span>
  <span class="badge" style="color:#b91c1c;background:#fee2e2">SCADUTO</span>
  <span class="badge" style="color:#a16207;background:#fef3c7">BOZZA</span>
  <span class="badge" style="color:#7c3aed;background:#ede9fe">DISMESSO</span>
  <span class="badge" style="color:#475569;background:#e2e8f0">N/D</span>
</div>
<div class="section-label">Badge Color Swatches</div>
<div class="swatch-grid">
  <div class="swatch"><div class="top" style="background:#dcfce7;border:1px solid #bbf7d0"></div><div class="bot"><div class="name" style="color:#15803d">Green</div></div></div>
  <div class="swatch"><div class="top" style="background:#ffedd5;border:1px solid #fed7aa"></div><div class="bot"><div class="name" style="color:#c2410c">Orange</div></div></div>
  <div class="swatch"><div class="top" style="background:#fee2e2;border:1px solid #fecaca"></div><div class="bot"><div class="name" style="color:#b91c1c">Red</div></div></div>
  <div class="swatch"><div class="top" style="background:#fef3c7;border:1px solid #fde68a"></div><div class="bot"><div class="name" style="color:#a16207">Yellow</div></div></div>
  <div class="swatch"><div class="top" style="background:#dbeafe;border:1px solid #bfdbfe"></div><div class="bot"><div class="name" style="color:#1d4ed8">Blue</div></div></div>
  <div class="swatch"><div class="top" style="background:#ede9fe;border:1px solid #ddd6fe"></div><div class="bot"><div class="name" style="color:#7c3aed">Purple</div></div></div>
  <div class="swatch"><div class="top" style="background:#e2e8f0;border:1px solid #cbd5e1"></div><div class="bot"><div class="name" style="color:#475569">Gray</div></div></div>
</div>
</body>
</html>
