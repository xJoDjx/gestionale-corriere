<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; background:#0f1117; padding:20px; }
.row { display:flex; gap:10px; margin-bottom:10px; }
.swatch { flex:1; border-radius:8px; overflow:hidden; }
.swatch-color { height:48px; }
.swatch-info { background:#1a1d27; border:1px solid #2a2e3d; border-top:none; padding:8px 10px; border-radius:0 0 8px 8px; }
.swatch-name { font-size:11px; font-weight:700; color:#e8eaf0; }
.swatch-hex  { font-size:10px; color:#6b7280; font-family:monospace; margin-top:1px; }
.section-label { font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#6b7280; margin-bottom:8px; }
.badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="section-label">Dark Theme — Backgrounds</div>
<div class="row">
  <div class="swatch"><div class="swatch-color" style="background:#0f1117"></div><div class="swatch-info"><div class="swatch-name">bg-primary</div><div class="swatch-hex">#0f1117</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#1a1d27"></div><div class="swatch-info"><div class="swatch-name">bg-secondary</div><div class="swatch-hex">#1a1d27</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#242837"></div><div class="swatch-info"><div class="swatch-name">bg-tertiary</div><div class="swatch-hex">#242837</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#2a2e3d"></div><div class="swatch-info"><div class="swatch-name">bg-elevated</div><div class="swatch-hex">#2a2e3d</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#323750"></div><div class="swatch-info"><div class="swatch-name">bg-hover</div><div class="swatch-hex">#323750</div></div></div>
</div>
<div class="section-label">Dark Theme — Brand + Badges</div>
<div class="row" style="align-items:center;flex-wrap:wrap;gap:6px;">
  <span class="badge" style="color:#818cf8;background:rgba(99,102,241,0.15)">PRIMARY</span>
  <span class="badge" style="color:#4ade80;background:rgba(34,197,94,0.18)">ATTIVO</span>
  <span class="badge" style="color:#60a5fa;background:rgba(59,130,246,0.18)">INFO</span>
  <span class="badge" style="color:#fb923c;background:rgba(249,115,22,0.18)">WARNING</span>
  <span class="badge" style="color:#f87171;background:rgba(239,68,68,0.18)">DANGER</span>
  <span class="badge" style="color:#fbbf24;background:rgba(245,158,11,0.18)">BOZZA</span>
  <span class="badge" style="color:#c084fc;background:rgba(168,85,247,0.18)">DISMESSO</span>
</div>
</body>
</html>
